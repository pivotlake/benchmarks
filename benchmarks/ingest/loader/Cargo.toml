[package]
name = "logs-load"
version = "0.1.0"
edition = "2024"

# The Arrow crates are pivot's fork at the commit pivot builds against, so the
# VARIANT columns are encoded the way the server reads them.
[dependencies]
arrow-array = { git = "https://github.com/pivotlake/arrow-rs", rev = "801b978071829d0f9ef5980dc37c7fbcbed1bb78" }
arrow-ipc = { git = "https://github.com/pivotlake/arrow-rs", rev = "801b978071829d0f9ef5980dc37c7fbcbed1bb78" }
arrow-schema = { git = "https://github.com/pivotlake/arrow-rs", rev = "801b978071829d0f9ef5980dc37c7fbcbed1bb78" }
parquet-variant-compute = { git = "https://github.com/pivotlake/arrow-rs", rev = "801b978071829d0f9ef5980dc37c7fbcbed1bb78" }
bytes = "1"
clickhouse = "0.15"
futures = "0.3"
tokio = { version = "1", features = ["rt", "time"] }
serde = { version = "1", features = ["derive"] }
tokio-postgres = "0.7"

[profile.release]
debug = false
